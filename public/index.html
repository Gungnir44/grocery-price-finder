<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grocery Price Finder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
    <div class="container mt-5">
        <h1 class="text-center mb-4">🥦 Grocery Price Finder 🛒</h1>

        <div class="row g-3 align-items-center mb-4">
            <div class="col-md-5">
                <input type="text" id="search" class="form-control" placeholder="Enter grocery item">
            </div>
            <div class="col-md-3">
                <input type="text" id="storeFilter" class="form-control" placeholder="Filter by store (optional)">
            </div>
            <div class="col-md-2">
                <button class="btn btn-primary w-100" onclick="searchItem()">Find Cheapest</button>
            </div>
            <div class="col-md-2">
                <button class="btn btn-secondary w-100" onclick="showAllItems()">Show All</button>
            </div>
        </div>

        <div id="alertArea"></div>
        <div id="results"></div>
    </div>

    <script>
        async function searchItem() {
            const item = document.getElementById('search').value.trim();
            const store = document.getElementById('storeFilter').value.trim();
            if (!item) {
                showAlert('Please enter a grocery item.', 'warning');
                return;
            }

            let url = `http://localhost:5000/api/cheapest?item=${encodeURIComponent(item)}`;
            if (store) {
                url = `http://localhost:5000/api/items/filter?store=${encodeURIComponent(store)}`;
            }

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.length === 0) {
                    showAlert('No results found. Try another item or store.', 'danger');
                    document.getElementById('results').innerHTML = '';
                } else {
                    showAlert(`Found ${data.length} result(s).`, 'success');
                    displayResults(data);
                }
            } catch (err) {
                showAlert('Error fetching data.', 'danger');
                console.error(err);
            }
        }

        async function showAllItems() {
            try {
                const response = await fetch('/api/items');
                const data = await response.json();

                if (data.length === 0) {
                    showAlert('No items found in the database.', 'danger');
                    document.getElementById('results').innerHTML = '';
                } else {
                    showAlert(`Showing all ${data.length} item(s).`, 'info');
                    displayResults(data);
                }
            } catch (err) {
                showAlert('Error fetching data.', 'danger');
                console.error(err);
            }
        }

        function displayResults(data) {
            let html = '<table class="table table-bordered table-hover table-dark mt-4"><thead><tr><th>Name</th><th>Price</th><th>Store</th><th>Location</th></tr></thead><tbody>';
            data.forEach(item => {
                html += `<tr><td>${item.name}</td><td>$${item.price.toFixed(2)}</td><td>${item.store}</td><td>${item.location}</td></tr>`;
            });
            html += '</tbody></table>';
            document.getElementById('results').innerHTML = html;
        }

        function showAlert(message, type) {
            const alertArea = document.getElementById('alertArea');
            alertArea.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `;
        }
    </script>
</body>
</html>
